name: renova-ponto

services:
  ponto-renova:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3001}:3000"
    volumes:
      - ./data:/usr/src/app/data
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
